name: Deploy

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      old_deployment_ids: ${{ steps.prune.outputs.old_deployment_ids }}
    steps:
      - name: Download latest scan output
        id: download
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "index.html" --dir site --clobber

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}

      - name: List Cloudflare Pages deployments
        id: list
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deployment list --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --json

      - name: Compute old Pages deployments to prune
        id: prune
        env:
          DEPLOYMENT_LIST_JSON: ${{ steps.list.outputs.command-output }}
        run: |
          set -euo pipefail
          keep=10
          old_ids=$(echo "$DEPLOYMENT_LIST_JSON" | jq -c --argjson keep "$keep" '
            [.[] | select(.Environment == "Production")] | .[$keep:] | [.[].Id]
          ')
          echo "old_deployment_ids=$old_ids" >> "$GITHUB_OUTPUT"

  cleanup-old-pages-deployments:
    needs: cloudflare
    if: ${{ needs.cloudflare.outputs.old_deployment_ids != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        deployment_id: ${{ fromJson(needs.cloudflare.outputs.old_deployment_ids) }}
    steps:
      - name: Delete old Cloudflare Pages deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deployment delete ${{ matrix.deployment_id }} --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} -f
