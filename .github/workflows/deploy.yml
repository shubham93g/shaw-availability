name: Deploy

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download latest scan output
        id: download
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "index.html" --dir site --clobber

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}

      - name: Clean up old Cloudflare Pages deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          keep=10
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME/deployments"
          all=$(mktemp)
          page=1
          total_pages=1
          while [ "$page" -le "$total_pages" ]; do
            resp=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base?page=$page")
            echo "$resp" | jq -r '.result[] | select(.environment == "production") | "\(.created_on)\t\(.id)"' >> "$all"
            total_pages=$(echo "$resp" | jq '.result_info.total_pages')
            page=$((page + 1))
          done
          echo "Found $(wc -l < "$all") production deployments across $((total_pages)) page(s)"
          old_ids=$(sort -r "$all" | tail -n "+$((keep + 1))" | cut -f2)
          for id in $old_ids; do
            echo "Deleting old Pages deployment $id"
            curl -sf -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$base/$id" \
              || echo "::warning::Failed to delete Pages deployment $id"
          done
