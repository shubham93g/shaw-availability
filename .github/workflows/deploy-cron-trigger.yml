name: Deploy Cron Trigger

on:
  push:
    branches: [main]
    paths:
      - "cron-trigger/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cron-trigger
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cron-trigger
          command: deploy
