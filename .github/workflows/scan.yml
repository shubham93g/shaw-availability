name: Scan

run-name: "Scan (${{ inputs.source }})"

on:
  workflow_dispatch:
    inputs:
      generate_report:
        description: "Trigger the report workflow (which then deploys) after a successful scan"
        type: boolean
        default: true
      source:
        description: "What triggered this run (set to 'cron' by the cron-trigger Worker; leave as manual for a human-initiated run)"
        type: choice
        options:
          - manual
          - cron
        default: manual

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record trigger source
        run: |
          echo "Triggered by: **${{ inputs.source }}**" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run scan
        run: python main.py scan --verbose

      - name: Publish scan output to the "latest" release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest artifacts/scan_result.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest artifacts/scan_result.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest" \
              --notes "Automated scan output, overwritten every run. Not a software release."
          fi

  report:
    needs: scan
    if: ${{ inputs.generate_report }}
    uses: ./.github/workflows/report.yml
    with:
      deploy: true
      skip_tests: true
    secrets: inherit
