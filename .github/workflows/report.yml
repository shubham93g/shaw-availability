name: Report

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Trigger the deploy workflow after generating the report"
        type: boolean
        default: true
  workflow_call:
    inputs:
      deploy:
        description: "Trigger the deploy workflow after generating the report"
        type: boolean
        default: true
      skip_tests:
        description: "Skip the test suite (set by scan.yml, which already ran it against the same commit)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: python -m unittest discover -s tests -v

      - name: Download latest scan result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "scan_result.json" --dir artifacts --clobber

      - name: Generate report
        run: |
          {
            echo '```'
            python main.py report
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish report output to the "latest" release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload latest artifacts/index.html --repo "$GITHUB_REPOSITORY" --clobber

  deploy:
    needs: generate
    if: ${{ inputs.deploy }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
