name = "shaw-availability-cron"
main = "src/index.js"
compatibility_date = "2026-07-21"
workers_dev = false
# Deployed automatically by .github/workflows/deploy-cron-trigger.yml on
# every push to main that touches cron-trigger/** (or via manual dispatch).

[triggers]
# Cloudflare Cron Triggers run in UTC; SGT is UTC+8 with no DST.
# 7:01am-12:01am SGT = 23:01 (previous day) - 16:01 UTC, hourly.
# Single overnight check-in at 4:01am SGT = 20:01 UTC.
crons = [
  "1 20 * * *",       # 4:01am SGT (single overnight run)
  "1 23,0-16 * * *",  # 7:01am-12:01am SGT, hourly
]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
GITHUB_OWNER = "shubham93g"
GITHUB_REPO = "shaw-availability"
GITHUB_WORKFLOW_FILE = "scan.yml"
GITHUB_REF = "main"

# GITHUB_TOKEN is a secret, not a var - set it with:
#   wrangler secret put GITHUB_TOKEN
